services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Dilrajno.1
      MYSQL_DATABASE: late_delivery_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5